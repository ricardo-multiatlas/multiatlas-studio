<!-- services-grid -->
<section id="servicios" class="relative py-24 md:py-32 px-6">
  <div class="max-w-6xl mx-auto">
    <div class="text-center max-w-2xl mx-auto">
      <span class="ma-eyebrow ma-reveal">{{eyebrow}}</span>
      <h2 class="ma-display ma-reveal text-2xl md:text-4xl font-semibold mt-6">{{headline}}</h2>
      <p class="ma-muted ma-reveal mt-4">{{sub}}</p>
    </div>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 mt-14">
<!--@each services-->
      <div class="ma-card ma-reveal p-7 flex flex-col">
        <div class="text-2xl" style="color: var(--ma-accent);">{{icon}}</div>
        <h3 class="ma-display text-lg font-semibold mt-4">{{title}}</h3>
        <p class="ma-muted text-sm mt-2 flex-1">{{desc}}</p>
        <p class="text-sm font-semibold mt-5" style="color: var(--ma-accent);">{{price}}</p>
      </div>
<!--@end-->
    </div>
  </div>
</section>
