<!-- cta-banner -->
<section class="relative px-6 py-10">
  <div class="max-w-6xl mx-auto ma-reveal rounded-3xl px-8 py-14 md:px-16 md:py-20 relative overflow-hidden text-center" style="background: var(--ma-accent); border-radius: calc(var(--ma-radius) + 1rem);">
    <div class="ma-glow-orb ma-float w-80 h-80 -top-32 -right-16 opacity-25" style="background: #ffffff;"></div>
    <div class="ma-glow-orb ma-float w-64 h-64 -bottom-24 -left-10 opacity-20" style="background: #ffffff; animation-delay: -3s;"></div>
    <h2 class="ma-display text-2xl md:text-4xl font-semibold text-white relative z-10">{{headline}}</h2>
    <p class="mt-4 relative z-10 max-w-xl mx-auto" style="color: rgba(255,255,255,0.86);">{{sub}}</p>
    <div class="mt-9 relative z-10 flex flex-wrap items-center justify-center gap-4">
      <a href="{{cta_href}}" class="ma-btn" style="background: #ffffff; color: var(--ma-accent);">{{cta}} →</a>
      <a href="{{cta2_href}}" class="ma-btn" style="background: transparent; color: #ffffff; border: 1px solid rgba(255,255,255,0.5);">{{cta2}}</a>
    </div>
  </div>
</section>
