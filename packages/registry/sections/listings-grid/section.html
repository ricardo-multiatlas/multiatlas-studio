<!-- listings-grid -->
<section id="propiedades" class="relative py-24 md:py-32 px-6">
  <div class="max-w-6xl mx-auto">
    <div class="flex flex-wrap items-end justify-between gap-6">
      <div>
        <span class="ma-eyebrow ma-reveal">{{eyebrow}}</span>
        <h2 class="ma-display ma-reveal text-2xl md:text-4xl font-semibold mt-6">{{headline}}</h2>
      </div>
      <p class="ma-muted ma-reveal max-w-xs text-sm">{{sub}}</p>
    </div>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-14">
<!--@each listings-->
      <div class="ma-card ma-reveal overflow-hidden">
        <div class="relative h-52 flex items-end p-5" style="background: linear-gradient(160deg, color-mix(in srgb, var(--ma-accent) 28%, var(--ma-bg)), color-mix(in srgb, var(--ma-accent) 48%, var(--ma-text)));">
          <img src="{{img}}" alt="" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display='none'" />
          <div class="absolute inset-0" style="background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.55));"></div>
          <span class="text-xs font-semibold px-3 py-1 rounded-full text-white absolute top-4 left-4 z-10" style="background: rgba(0,0,0,0.35);">{{zona}}</span>
          <p class="ma-display text-2xl font-bold text-white relative z-10">{{precio}}</p>
        </div>
        <div class="p-5">
          <p class="font-semibold">{{titulo}}</p>
          <p class="ma-muted text-sm mt-2">{{rec}} rec · {{ban}} baños · {{m2}} m²</p>
        </div>
      </div>
<!--@end-->
    </div>
    <div class="text-center mt-12 ma-reveal"><a href="{{cta_href}}" class="ma-btn ma-btn-ghost">{{cta}} →</a></div>
  </div>
</section>
