<!-- contact-form -->
<section id="contacto" class="relative py-24 md:py-32 px-6">
  <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-14 items-start">
    <div>
      <span class="ma-eyebrow ma-reveal">{{eyebrow}}</span>
      <h2 class="ma-display ma-reveal text-2xl md:text-4xl font-semibold mt-6">{{headline}}</h2>
      <p class="ma-muted ma-reveal mt-4 max-w-md">{{sub}}</p>
      <ul class="mt-8 space-y-4 text-sm ma-reveal">
        <li class="flex gap-3"><span style="color: var(--ma-accent);">✓</span>{{b1}}</li>
        <li class="flex gap-3"><span style="color: var(--ma-accent);">✓</span>{{b2}}</li>
        <li class="flex gap-3"><span style="color: var(--ma-accent);">✓</span>{{b3}}</li>
      </ul>
      <p class="ma-muted text-sm mt-8">O escríbenos directo: <a href="mailto:{{email_directo}}" class="font-semibold" style="color: var(--ma-accent);">{{email_directo}}</a></p>
    </div>
    <form action="{{form_action}}" method="POST" class="ma-card ma-reveal p-8 space-y-5">
      <input type="hidden" name="_subject" value="{{form_subject}}" />
      <input type="hidden" name="_template" value="table" />
      <input type="hidden" name="_captcha" value="false" />
      <div>
        <label class="text-sm font-semibold block mb-2">Nombre</label>
        <input required name="nombre" type="text" class="w-full rounded-lg px-4 py-3 text-sm outline-none" style="background: var(--ma-surface); border: 1px solid var(--ma-border); color: var(--ma-text);" placeholder="Tu nombre" />
      </div>
      <div>
        <label class="text-sm font-semibold block mb-2">Email</label>
        <input required name="email" type="email" class="w-full rounded-lg px-4 py-3 text-sm outline-none" style="background: var(--ma-surface); border: 1px solid var(--ma-border); color: var(--ma-text);" placeholder="{{f2_placeholder}}" />
      </div>
      <div>
        <label class="text-sm font-semibold block mb-2">{{f3_label}}</label>
        <input name="empresa" type="text" class="w-full rounded-lg px-4 py-3 text-sm outline-none" style="background: var(--ma-surface); border: 1px solid var(--ma-border); color: var(--ma-text);" placeholder="{{f3_placeholder}}" />
      </div>
      <div>
        <label class="text-sm font-semibold block mb-2">Qué necesitas</label>
        <select name="interes" class="w-full rounded-lg px-4 py-3 text-sm outline-none" style="background: var(--ma-surface); border: 1px solid var(--ma-border); color: var(--ma-text);">
          <option>{{opt1}}</option>
          <option>{{opt2}}</option>
          <option>{{opt3}}</option>
          <option>{{opt4}}</option>
          <option>{{opt5}}</option>
        </select>
      </div>
      <div>
        <label class="text-sm font-semibold block mb-2">Cuéntanos más</label>
        <textarea name="mensaje" rows="3" class="w-full rounded-lg px-4 py-3 text-sm outline-none" style="background: var(--ma-surface); border: 1px solid var(--ma-border); color: var(--ma-text);" placeholder="{{f5_placeholder}}"></textarea>
      </div>
      <button type="submit" class="ma-btn ma-btn-gradient w-full justify-center">{{cta}} →</button>
      <p class="ma-muted text-xs text-center">{{nota}}</p>
    </form>
  </div>
</section>
