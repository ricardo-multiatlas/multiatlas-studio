<!-- footer-cta -->
<footer id="footer" class="relative overflow-hidden pt-28 pb-10 px-6" style="border-top: 1px solid var(--ma-border);">
  <div class="ma-glow-orb w-[600px] h-[300px] -bottom-40 left-1/2 -translate-x-1/2 opacity-70" style="background: var(--ma-glow);"></div>
  <div class="relative z-10 max-w-6xl mx-auto">
    <div class="text-center max-w-2xl mx-auto">
      <h2 class="ma-display ma-reveal text-3xl md:text-5xl font-semibold leading-[1.08]">{{headline}}</h2>
      <p class="ma-muted ma-reveal mt-5">{{sub}}</p>
      <div class="ma-reveal mt-9"><a href="{{cta_href}}" class="ma-btn ma-btn-gradient text-lg px-9 py-4">{{cta}} →</a></div>
    </div>
    <div class="grid md:grid-cols-4 gap-10 mt-24 pt-10 text-sm" style="border-top: 1px solid var(--ma-border);">
      <div class="md:col-span-2">
        <p class="ma-display font-bold text-lg">{{brand}}</p>
        <p class="ma-muted mt-4 max-w-xs">{{tagline}}</p>
      </div>
      <div>
        <p class="font-semibold mb-4">{{col1_title}}</p>
        <ul class="ma-muted space-y-2.5">
          <li><a href="{{col1_l1_href}}" class="hover:opacity-70">{{col1_l1}}</a></li>
          <li><a href="{{col1_l2_href}}" class="hover:opacity-70">{{col1_l2}}</a></li>
          <li><a href="{{col1_l3_href}}" class="hover:opacity-70">{{col1_l3}}</a></li>
        </ul>
      </div>
      <div>
        <p class="font-semibold mb-4">{{col2_title}}</p>
        <ul class="ma-muted space-y-2.5">
          <li><a href="{{col2_l1_href}}" class="hover:opacity-70">{{col2_l1}}</a></li>
          <li><a href="{{col2_l2_href}}" class="hover:opacity-70">{{col2_l2}}</a></li>
          <li><a href="{{col2_l3_href}}" class="hover:opacity-70">{{col2_l3}}</a></li>
        </ul>
      </div>
    </div>
    <p class="ma-muted text-xs mt-12">{{legal}}</p>
  </div>
</footer>
