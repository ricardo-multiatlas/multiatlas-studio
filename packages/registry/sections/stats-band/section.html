<!-- stats-band -->
<section class="relative py-14 px-6" style="border-top: 1px solid var(--ma-border); border-bottom: 1px solid var(--ma-border);">
  <div class="max-w-5xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-8 text-center">
    <div class="ma-reveal"><p class="ma-display text-4xl font-bold" style="color: var(--ma-accent);">{{n1}}<span class="text-2xl">{{n1_suf}}</span></p><p class="ma-muted text-sm mt-1">{{n1_label}}</p></div>
    <div class="ma-reveal"><p class="ma-display text-4xl font-bold" style="color: var(--ma-accent);">{{n2}}<span class="text-2xl">{{n2_suf}}</span></p><p class="ma-muted text-sm mt-1">{{n2_label}}</p></div>
    <div class="ma-reveal"><p class="ma-display text-4xl font-bold" style="color: var(--ma-accent);">{{n3}}<span class="text-2xl">{{n3_suf}}</span></p><p class="ma-muted text-sm mt-1">{{n3_label}}</p></div>
    <div class="ma-reveal"><p class="ma-display text-4xl font-bold" style="color: var(--ma-accent);">{{n4}}<span class="text-2xl">{{n4_suf}}</span></p><p class="ma-muted text-sm mt-1">{{n4_label}}</p></div>
  </div>
</section>
