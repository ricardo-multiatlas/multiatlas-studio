<!-- hero-product -->
<section class="relative overflow-hidden py-28 md:py-36 px-6">
  <video class="ma-video-bg" src="{{video_url}}" autoplay muted loop playsinline onerror="this.remove()" oncanplay="this.classList.add('ma-live')" style="opacity: {{video_opacity}};"></video>
  <div class="ma-glow-orb w-[480px] h-[480px] top-[-140px] right-[-120px]" data-parallax="0.1" style="background: var(--ma-glow);"></div>
  <div class="relative z-10 max-w-6xl mx-auto grid md:grid-cols-2 gap-16 items-center">
    <div>
      <span class="ma-eyebrow ma-glass ma-reveal">{{eyebrow}}</span>
      <h1 class="ma-display text-3xl md:text-5xl font-semibold mt-6 leading-[1.1]" data-chars>{{headline}}</h1>
      <p class="ma-muted ma-reveal text-base mt-6 max-w-md">{{sub}}</p>
      <div class="ma-reveal mt-9">
        <a href="{{cta_href}}" class="ma-btn ma-btn-gradient">{{cta}} →</a>
      </div>
    </div>
    <div class="ma-reveal">
      <div class="ma-card ma-tilt ma-float p-2 shadow-2xl">
        <div class="flex items-center gap-2 px-4 py-3" style="border-bottom: 1px solid var(--ma-border);">
          <span class="w-3 h-3 rounded-full bg-red-400/70"></span>
          <span class="w-3 h-3 rounded-full bg-yellow-400/70"></span>
          <span class="w-3 h-3 rounded-full bg-green-400/70"></span>
          <span class="ma-muted text-xs ml-3 font-mono">{{mock_title}}</span>
        </div>
        <div class="p-6 font-mono text-sm space-y-3">
          <p class="ma-muted">{{mock_line1}}</p>
          <p class="ma-muted">{{mock_line2}}</p>
          <p style="color: var(--ma-accent);">{{mock_line3}}</p>
          <div class="h-2 rounded-full overflow-hidden mt-4" style="background: var(--ma-surface);">
            <div class="h-full w-4/5 rounded-full" style="background: var(--ma-accent);"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
