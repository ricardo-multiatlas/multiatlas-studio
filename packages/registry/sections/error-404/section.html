<!-- error-404 -->
<section class="relative overflow-hidden min-h-[92vh] flex items-center justify-center text-center px-6">
  <div class="ma-glow-orb ma-pulse w-[500px] h-[500px] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" style="background: var(--ma-glow);"></div>
  <div class="relative z-10">
    <p class="ma-display ma-float text-[6rem] md:text-[9rem] font-semibold leading-none select-none" style="color: var(--ma-accent);">{{code}}</p>
    <h1 class="ma-display text-xl md:text-3xl font-semibold mt-2">{{headline}}</h1>
    <p class="ma-muted mt-4 max-w-md mx-auto">{{sub}}</p>
    <div class="mt-9"><a href="{{cta_href}}" class="ma-btn">← {{cta}}</a></div>
  </div>
</section>
