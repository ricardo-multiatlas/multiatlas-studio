<!-- steps-process -->
<section id="proceso" class="relative py-24 md:py-28 px-6" style="background: var(--ma-surface);">
  <div class="max-w-5xl mx-auto">
    <div class="text-center max-w-2xl mx-auto">
      <span class="ma-eyebrow ma-reveal">{{eyebrow}}</span>
      <h2 class="ma-display ma-reveal text-2xl md:text-4xl font-semibold mt-6">{{headline}}</h2>
    </div>
    <div class="grid sm:grid-cols-2 md:grid-cols-3 gap-10 mt-14">
<!--@each steps-->
      <div class="ma-reveal">
        <p class="ma-display text-5xl font-bold" style="color: color-mix(in srgb, var(--ma-accent) 35%, transparent);">{{num}}</p>
        <h3 class="ma-display text-lg font-semibold mt-4">{{title}}</h3>
        <p class="ma-muted text-sm mt-2">{{desc}}</p>
      </div>
<!--@end-->
    </div>
  </div>
</section>
