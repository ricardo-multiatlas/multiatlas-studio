<!-- steps-process -->
<section id="proceso" class="relative py-24 md:py-28 px-6" style="background: var(--ma-surface);">
  <div class="max-w-5xl mx-auto">
    <div class="text-center max-w-2xl mx-auto">
      <span class="ma-eyebrow ma-reveal">{{eyebrow}}</span>
      <h2 class="ma-display ma-reveal text-2xl md:text-4xl font-semibold mt-6">{{headline}}</h2>
    </div>
    <div class="grid md:grid-cols-3 gap-10 mt-14">
      <div class="ma-reveal">
        <p class="ma-display text-5xl font-bold" style="color: color-mix(in srgb, var(--ma-accent) 35%, transparent);">01</p>
        <h3 class="ma-display text-lg font-semibold mt-4">{{p1_title}}</h3>
        <p class="ma-muted text-sm mt-2">{{p1_desc}}</p>
      </div>
      <div class="ma-reveal">
        <p class="ma-display text-5xl font-bold" style="color: color-mix(in srgb, var(--ma-accent) 35%, transparent);">02</p>
        <h3 class="ma-display text-lg font-semibold mt-4">{{p2_title}}</h3>
        <p class="ma-muted text-sm mt-2">{{p2_desc}}</p>
      </div>
      <div class="ma-reveal">
        <p class="ma-display text-5xl font-bold" style="color: color-mix(in srgb, var(--ma-accent) 35%, transparent);">03</p>
        <h3 class="ma-display text-lg font-semibold mt-4">{{p3_title}}</h3>
        <p class="ma-muted text-sm mt-2">{{p3_desc}}</p>
      </div>
    </div>
  </div>
</section>
