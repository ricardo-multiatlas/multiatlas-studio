<!-- menu-list -->
<section id="menu" class="relative py-24 md:py-32 px-6">
  <div class="max-w-4xl mx-auto">
    <div class="text-center max-w-2xl mx-auto">
      <span class="ma-eyebrow ma-reveal">{{eyebrow}}</span>
      <h2 class="ma-display ma-reveal text-2xl md:text-4xl font-semibold mt-6">{{headline}}</h2>
      <p class="ma-muted ma-reveal mt-4">{{sub}}</p>
    </div>
    <div class="grid md:grid-cols-2 gap-x-16 gap-y-10 mt-14">
      <div class="ma-reveal">
        <h3 class="ma-display text-sm font-semibold tracking-[0.2em] uppercase" style="color: var(--ma-accent);">{{cat1}}</h3>
        <div class="mt-6 space-y-6">
<!--@each cat1items-->
          <div><div class="flex items-baseline justify-between gap-4"><p class="font-semibold">{{name}}</p><span class="flex-1 border-b border-dotted" style="border-color: var(--ma-border);"></span><p class="font-semibold" style="color: var(--ma-accent);">{{price}}</p></div><p class="ma-muted text-sm mt-1">{{desc}}</p></div>
<!--@end-->
        </div>
      </div>
      <div class="ma-reveal">
        <h3 class="ma-display text-sm font-semibold tracking-[0.2em] uppercase" style="color: var(--ma-accent);">{{cat2}}</h3>
        <div class="mt-6 space-y-6">
<!--@each cat2items-->
          <div><div class="flex items-baseline justify-between gap-4"><p class="font-semibold">{{name}}</p><span class="flex-1 border-b border-dotted" style="border-color: var(--ma-border);"></span><p class="font-semibold" style="color: var(--ma-accent);">{{price}}</p></div><p class="ma-muted text-sm mt-1">{{desc}}</p></div>
<!--@end-->
        </div>
      </div>
    </div>
    <p class="ma-muted text-xs text-center mt-12">{{nota}}</p>
  </div>
</section>
