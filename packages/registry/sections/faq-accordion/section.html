<!-- faq-accordion -->
<section id="faq" class="relative py-24 md:py-28 px-6">
  <div class="max-w-3xl mx-auto">
    <div class="text-center">
      <span class="ma-eyebrow ma-reveal">{{eyebrow}}</span>
      <h2 class="ma-display ma-reveal text-2xl md:text-4xl font-semibold mt-6">{{headline}}</h2>
    </div>
    <div class="mt-12 space-y-4">
      <details class="ma-faq ma-card ma-reveal p-6">
        <summary class="flex items-center justify-between gap-4 font-semibold">{{q1}}<span class="ma-faq-icon text-xl" style="color: var(--ma-accent);">+</span></summary>
        <p class="ma-muted text-sm mt-4 leading-relaxed">{{a1}}</p>
      </details>
      <details class="ma-faq ma-card ma-reveal p-6">
        <summary class="flex items-center justify-between gap-4 font-semibold">{{q2}}<span class="ma-faq-icon text-xl" style="color: var(--ma-accent);">+</span></summary>
        <p class="ma-muted text-sm mt-4 leading-relaxed">{{a2}}</p>
      </details>
      <details class="ma-faq ma-card ma-reveal p-6">
        <summary class="flex items-center justify-between gap-4 font-semibold">{{q3}}<span class="ma-faq-icon text-xl" style="color: var(--ma-accent);">+</span></summary>
        <p class="ma-muted text-sm mt-4 leading-relaxed">{{a3}}</p>
      </details>
      <details class="ma-faq ma-card ma-reveal p-6">
        <summary class="flex items-center justify-between gap-4 font-semibold">{{q4}}<span class="ma-faq-icon text-xl" style="color: var(--ma-accent);">+</span></summary>
        <p class="ma-muted text-sm mt-4 leading-relaxed">{{a4}}</p>
      </details>
    </div>
  </div>
</section>
