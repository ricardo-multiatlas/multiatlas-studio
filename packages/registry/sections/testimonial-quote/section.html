<!-- testimonial-quote -->
<section class="relative py-24 md:py-32 px-6 overflow-hidden">
  <div class="ma-glow-orb w-[420px] h-[420px] -top-32 left-1/2 -translate-x-1/2 opacity-50" style="background: var(--ma-glow);"></div>
  <div class="relative z-10 max-w-3xl mx-auto text-center">
    <div class="ma-display ma-reveal text-6xl leading-none" style="color: var(--ma-accent);">“</div>
    <blockquote class="ma-display ma-reveal text-2xl md:text-3xl font-medium leading-snug mt-2">{{quote}}</blockquote>
    <div class="ma-reveal mt-10 flex items-center justify-center gap-4">
      <div class="w-12 h-12 rounded-full flex items-center justify-center ma-display font-semibold" style="background: var(--ma-surface); border: 1px solid var(--ma-border); color: var(--ma-accent);">{{ini}}</div>
      <div class="text-left">
        <p class="font-semibold text-sm">{{name}}</p>
        <p class="ma-muted text-xs">{{role}}</p>
      </div>
    </div>
  </div>
</section>
