<!-- features-bento -->
<section id="features" class="relative py-24 md:py-32 px-6">
  <div class="max-w-6xl mx-auto">
    <div class="text-center max-w-2xl mx-auto">
      <span class="ma-eyebrow ma-reveal">{{eyebrow}}</span>
      <h2 class="ma-display ma-reveal text-2xl md:text-4xl font-semibold mt-6">{{headline}}</h2>
      <p class="ma-muted ma-reveal mt-4">{{sub}}</p>
    </div>
    <div class="grid md:grid-cols-6 gap-5 mt-14">
<!--@each features-->
      <div class="ma-card ma-tilt ma-reveal md:col-span-{{span}} p-8 relative overflow-hidden">
        <div class="ma-glow-orb w-56 h-56 -top-20 -right-20 opacity-60" style="background: var(--ma-glow);"></div>
        <div class="text-3xl relative" style="color: var(--ma-accent);">{{icon}}</div>
        <h3 class="ma-display text-xl font-semibold mt-4 relative">{{title}}</h3>
        <p class="ma-muted mt-2 text-sm relative">{{desc}}</p>
      </div>
<!--@end-->
    </div>
  </div>
</section>
