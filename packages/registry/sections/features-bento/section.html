<!-- features-bento -->
<section id="features" class="relative py-24 md:py-32 px-6">
  <div class="max-w-6xl mx-auto">
    <div class="text-center max-w-2xl mx-auto">
      <span class="ma-eyebrow ma-reveal">{{eyebrow}}</span>
      <h2 class="ma-display ma-reveal text-2xl md:text-4xl font-semibold mt-6">{{headline}}</h2>
      <p class="ma-muted ma-reveal mt-4">{{sub}}</p>
    </div>
    <div class="grid md:grid-cols-6 gap-5 mt-14">
      <div class="ma-card ma-tilt ma-reveal md:col-span-4 p-8 relative overflow-hidden">
        <div class="ma-glow-orb w-56 h-56 -top-20 -right-20 opacity-70" style="background: var(--ma-glow);"></div>
        <div class="text-3xl" style="color: var(--ma-accent);">{{f1_icon}}</div>
        <h3 class="ma-display text-2xl font-semibold mt-4">{{f1_title}}</h3>
        <p class="ma-muted mt-2 max-w-md">{{f1_desc}}</p>
      </div>
      <div class="ma-card ma-tilt ma-reveal md:col-span-2 p-8">
        <div class="text-3xl" style="color: var(--ma-accent-2);">{{f2_icon}}</div>
        <h3 class="ma-display text-xl font-semibold mt-4">{{f2_title}}</h3>
        <p class="ma-muted mt-2 text-sm">{{f2_desc}}</p>
      </div>
      <div class="ma-card ma-tilt ma-reveal md:col-span-2 p-8">
        <div class="text-3xl" style="color: var(--ma-accent);">{{f3_icon}}</div>
        <h3 class="ma-display text-xl font-semibold mt-4">{{f3_title}}</h3>
        <p class="ma-muted mt-2 text-sm">{{f3_desc}}</p>
      </div>
      <div class="ma-card ma-tilt ma-reveal md:col-span-2 p-8">
        <div class="text-3xl" style="color: var(--ma-accent);">{{f4_icon}}</div>
        <h3 class="ma-display text-xl font-semibold mt-4">{{f4_title}}</h3>
        <p class="ma-muted mt-2 text-sm">{{f4_desc}}</p>
      </div>
      <div class="ma-card ma-tilt ma-reveal md:col-span-2 p-8 relative overflow-hidden">
        <div class="text-3xl" style="color: var(--ma-accent-2);">{{f5_icon}}</div>
        <h3 class="ma-display text-xl font-semibold mt-4">{{f5_title}}</h3>
        <p class="ma-muted mt-2 text-sm">{{f5_desc}}</p>
      </div>
    </div>
  </div>
</section>
