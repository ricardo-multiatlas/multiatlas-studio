<!-- background-animated -->
<section class="relative overflow-hidden py-28 px-6 text-center">
  <div class="absolute inset-0 opacity-90" style="background: radial-gradient(ellipse 90% 70% at 50% 120%, color-mix(in srgb, var(--ma-accent) 14%, transparent), transparent 60%), radial-gradient(ellipse 60% 50% at 85% 0%, color-mix(in srgb, var(--ma-accent-2) 8%, transparent), transparent 60%);"></div>
  <div class="ma-glow-orb ma-float w-72 h-72 top-4 left-[8%] opacity-70" style="background: var(--ma-glow);"></div>
  <div class="ma-glow-orb ma-float w-56 h-56 bottom-0 right-[10%] opacity-60" style="background: color-mix(in srgb, var(--ma-accent-2) 10%, transparent); animation-delay: -3s;"></div>
  <div class="relative z-10 max-w-3xl mx-auto">
    <h2 class="ma-display ma-reveal text-2xl md:text-4xl font-semibold">{{headline}}</h2>
    <p class="ma-muted ma-reveal mt-5 text-base">{{sub}}</p>
    <div class="ma-reveal mt-9"><a href="{{cta_href}}" class="ma-btn">{{cta}} →</a></div>
  </div>
</section>
