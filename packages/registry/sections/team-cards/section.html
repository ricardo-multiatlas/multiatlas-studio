<!-- team-cards -->
<section id="equipo" class="relative py-24 md:py-28 px-6">
  <div class="max-w-5xl mx-auto">
    <div class="text-center max-w-2xl mx-auto">
      <span class="ma-eyebrow ma-reveal">{{eyebrow}}</span>
      <h2 class="ma-display ma-reveal text-2xl md:text-4xl font-semibold mt-6">{{headline}}</h2>
      <p class="ma-muted ma-reveal mt-4">{{sub}}</p>
    </div>
    <div class="grid sm:grid-cols-3 gap-6 mt-14">
      <div class="ma-card ma-reveal p-8 text-center">
        <div class="w-20 h-20 mx-auto rounded-full flex items-center justify-center text-xl font-bold text-white" style="background: linear-gradient(135deg, var(--ma-accent), color-mix(in srgb, var(--ma-accent) 60%, var(--ma-text)));">{{t1_ini}}</div>
        <h3 class="ma-display font-semibold mt-5">{{t1_name}}</h3>
        <p class="text-sm mt-1" style="color: var(--ma-accent);">{{t1_role}}</p>
        <p class="ma-muted text-xs mt-3">{{t1_cred}}</p>
      </div>
      <div class="ma-card ma-reveal p-8 text-center">
        <div class="w-20 h-20 mx-auto rounded-full flex items-center justify-center text-xl font-bold text-white" style="background: linear-gradient(135deg, var(--ma-accent), color-mix(in srgb, var(--ma-accent) 60%, var(--ma-text)));">{{t2_ini}}</div>
        <h3 class="ma-display font-semibold mt-5">{{t2_name}}</h3>
        <p class="text-sm mt-1" style="color: var(--ma-accent);">{{t2_role}}</p>
        <p class="ma-muted text-xs mt-3">{{t2_cred}}</p>
      </div>
      <div class="ma-card ma-reveal p-8 text-center">
        <div class="w-20 h-20 mx-auto rounded-full flex items-center justify-center text-xl font-bold text-white" style="background: linear-gradient(135deg, var(--ma-accent), color-mix(in srgb, var(--ma-accent) 60%, var(--ma-text)));">{{t3_ini}}</div>
        <h3 class="ma-display font-semibold mt-5">{{t3_name}}</h3>
        <p class="text-sm mt-1" style="color: var(--ma-accent);">{{t3_role}}</p>
        <p class="ma-muted text-xs mt-3">{{t3_cred}}</p>
      </div>
    </div>
  </div>
</section>
