<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>¡Listo! — Multiatlas Studio</title>
<meta name="description" content="Tu pago se completó. Bienvenido a Multiatlas Studio." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{ --bg:#0E1014; --panel:#151922; --line:rgba(255,255,255,.09); --txt:#EAECEF;
         --muted:rgba(234,236,239,.56); --accent:#5B8CFF; --ok:#37C892; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;
       background:radial-gradient(1200px 600px at 50% -10%, rgba(91,140,255,.16), transparent), var(--bg);
       color:var(--txt);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  .card{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:20px;
        padding:2.6rem 2.2rem;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.35)}
  .disp{font-family:'Space Grotesk',sans-serif;letter-spacing:-.02em}
  .muted{color:var(--muted)}
  .ring{width:76px;height:76px;border-radius:50%;margin:0 auto 1.4rem;display:flex;align-items:center;justify-content:center;
        background:color-mix(in srgb, var(--ok) 16%, transparent);border:1px solid color-mix(in srgb, var(--ok) 50%, transparent);
        color:var(--ok);font-size:2rem}
  .btn{display:inline-flex;align-items:center;gap:.5rem;border-radius:11px;padding:.8rem 1.4rem;font-weight:600;
       font-size:.9rem;cursor:pointer;border:1px solid transparent;text-decoration:none}
  .btn-primary{background:var(--accent);color:#0b1020}
  .btn-ghost{background:transparent;color:var(--txt);border-color:var(--line)}
  .row{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:1.8rem}
</style>
</head>
<body>
  <div class="card">
    <div class="ring">✓</div>
    <h1 class="disp" style="font-size:1.8rem;font-weight:600;margin:0">¡Pago completado!</h1>
    <p class="muted" style="margin-top:.8rem;line-height:1.55">
      Gracias por unirte a <strong style="color:var(--txt)">Multiatlas Studio</strong>. Tu acceso está activo.
      Entra al panel y arma tu primer site sobre secciones curadas.
    </p>
    <div class="row">
      <a class="btn btn-primary" href="/app/index.html">Abrir el Studio →</a>
      <a class="btn btn-ghost" href="/index.html">Volver al inicio</a>
    </div>
    <p class="muted" style="font-size:.75rem;margin-top:1.8rem">
      Recibirás el comprobante por correo. ¿Dudas? escríbenos a
      <a href="mailto:rubentoledano@multiatlas.net" style="color:var(--accent)">rubentoledano@multiatlas.net</a>.
    </p>
  </div>
</body>
</html>
